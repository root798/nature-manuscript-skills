<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-labelledby="title desc">
<title id="title">Macaron selection card</title>
<desc id="desc">Ten labelled colours in source order. The last patch looked peach despite its red printed code. A separate applied warning colour is shown below.</desc>
<rect width="1000" height="398" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#222222">
<text x="26" y="44" font-size="28" font-weight="700">Macaron selection card</text>
<text x="26" y="74" font-size="16" font-weight="400">Original order and printed labels. Swatch 10 shows the sampled image colour, explained below.</text>
<text x="28" y="115" font-size="14" font-weight="700">01</text>
<rect x="28" y="126" width="86" height="52" fill="#4F5B88" stroke="#777777" stroke-width="0.65"/>
