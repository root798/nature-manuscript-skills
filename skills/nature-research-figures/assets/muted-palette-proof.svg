<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="112.656mm" viewBox="0 0 692 426" role="img" aria-labelledby="heading desc">
<title id="heading">Low-chroma colours for research figures</title>
<desc id="desc">Two panels use the same five synthetic specimens with two alternative pairs of colours. Circles and diamonds distinguish the settings. Each point is a two-reading mean and its bar spans both readings. Four direct-labelled marker shapes, a magnitude scale and a signed scale show other encodings. A separate slashed cell marks missing data.</desc>
